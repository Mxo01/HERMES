[tool.mypy]
# Matches Raspberry Pi OS Bookworm, which is what the Pi actually runs. The
# type checker should model the deployment target, not the dev machine, or it
# happily accepts syntax the Pi cannot execute.
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = true
warn_return_any = true
# Tests are type-checked too: a test with the wrong shape is a test that
# silently asserts nothing. Only the virtualenv is out of scope.
exclude = "^venv/"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["hermes"]
# Branch coverage, not just line coverage: an `if` that only ever takes one
# path is untested, however many lines ran.
branch = true

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "pragma: no cover",
]
